# Register as app-service-functions-custom-middleware-build in the ADO mirror.
trigger:
  branches:
    include:
      - main

# Azure Repos PR validation is configured through branch policies.
pr: none

variables:
  WindowsContainerImage: onebranch.azurecr.io/windows/ltsc2022/vse2022:latest

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    featureFlags:
      WindowsHostVersion:
        Version: 2022
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true

    stages:
      - stage: Build
        jobs:
          - job: Package
            pool:
              type: windows
            variables:
              ob_outputDirectory: '$(Build.ArtifactStagingDirectory)\package'
              ob_artifactBaseName: python-build-outputs
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
                path: 's\package-src'

              - task: PipAuthenticate@1
                displayName: Authenticate dependency downloads through the Antares feed
                inputs:
                  artifactFeeds: Antares/antares-websites-ml-python
                  onlyAddExtraIndex: false

              # UsePythonVersion@0 installs a Python without its standard library
              # inside the OneBranch Windows container, so use the image's Python.
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $python = $null
                  if (Get-Command py -ErrorAction SilentlyContinue) {
                    $python = py -3.13-64 -I -c "import sys; print(sys.executable)"
                    if ($LASTEXITCODE -ne 0) { $python = $null }
                  }
                  if (-not $python) {
                    $python = @(
                      "$env:ProgramFiles\Python313\python.exe"
                      "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe"
                    ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
                  }
                  if (-not $python) { throw 'The build image must provide Python 3.13 x64.' }
                  $python = "$python".Trim()
                  & $python -I -c "import sys, struct; assert sys.version_info[:2] == (3, 13) and struct.calcsize('P') == 8, sys.version"
                  if ($LASTEXITCODE -ne 0) { throw "Unsupported Python runtime: $python" }
                  & $python -m pip --version
                  if ($LASTEXITCODE -ne 0) { throw "pip is unavailable for $python" }
                  $pythonDirectory = Split-Path -Parent $python
                  Write-Host "Selected Python: $python"
                  Write-Host "##vso[task.prependpath]$pythonDirectory\Scripts"
                  Write-Host "##vso[task.prependpath]$pythonDirectory"
                displayName: Select the image's Python 3.13 x64

              - pwsh: |
                  & "$(Pipeline.Workspace)\s\package-src\scripts\build-pypi.ps1" -TestResultsFile "$(Common.TestResultsDirectory)\pytest.xml"
                workingDirectory: '$(Pipeline.Workspace)\s\package-src'
                displayName: Test, build, and validate Python distributions

              - task: PublishTestResults@2
                displayName: Publish pytest results
                condition: succeededOrFailed()
                inputs:
                  testResultsFormat: JUnit
                  searchFolder: '$(Common.TestResultsDirectory)'
                  testResultsFiles: pytest.xml
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
                  testRunTitle: Package release tests

              - task: CopyFiles@2
                displayName: Stage validated distributions for OneBranch
                inputs:
                  SourceFolder: '$(Pipeline.Workspace)\s\package-src\dist'
                  Contents: |
                    *.whl
                    *.tar.gz
                  TargetFolder: '$(ob_outputDirectory)\dist'

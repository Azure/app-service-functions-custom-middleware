# Follows the reusable ESRP step pattern in Azure/azure-functions-python-extensions.
parameters:
  - name: folderLocation
    type: string
  - name: expectedVersion
    type: string
  - name: owners
    type: string
  - name: approvers
    type: string
  - name: displayName
    type: string
    default: Publish Python package through ESRP

steps:
  - pwsh: |
      $ErrorActionPreference = "Stop"

      function Assert-ResolvedValue {
          param([string] $Name, [string] $Value)

          $value = $Value.Trim()
          if (!$value -or $value -match '^\$\([^)]+\)$' -or $value.StartsWith("TODO-")) {
              throw "$Name is empty or unresolved. Supply the release configuration before publishing."
          }
          return $value
      }

      $folder = Assert-ResolvedValue "folderLocation" $env:ESRP_FOLDER_LOCATION
      if (!(Test-Path -LiteralPath $folder -PathType Container)) {
          throw "ESRP package folder does not exist: $folder"
      }
      $files = @(Get-ChildItem -LiteralPath $folder -File)
      $wheels = @($files | Where-Object { $_.Name -like "*.whl" })
      $sdists = @($files | Where-Object { $_.Name -like "*.tar.gz" })
      if ($files.Count -ne 2 -or $wheels.Count -ne 1 -or $sdists.Count -ne 1) {
          throw "Expected only one wheel and one source distribution from the package build"
      }

      $expectedVersion = Assert-ResolvedValue "expectedVersion" $env:ESRP_EXPECTED_VERSION
      $expectedName = "app-service-functions-custom-middleware"

      function Assert-PackageMetadata {
          param([string] $Metadata, [string] $ArtifactName)

          # Only inspect the metadata headers, never fields in the README body.
          $headers = ($Metadata -split '\r?\n\r?\n', 2)[0]
          $names = [regex]::Matches($headers, '(?m)^Name:[ \t]*([^\r\n]+)\r?$')
          $versions = [regex]::Matches($headers, '(?m)^Version:[ \t]*([^\r\n]+)\r?$')
          if ($names.Count -ne 1 -or $versions.Count -ne 1) {
              throw "Expected one Name and Version metadata header in $ArtifactName"
          }
          $name = $names[0].Groups[1].Value.Trim().ToLowerInvariant() -replace '[-_.]+', '-'
          $version = $versions[0].Groups[1].Value.Trim()
          if ($name -cne $expectedName -or $version -cne $expectedVersion) {
              throw "Artifact metadata mismatch in ${ArtifactName}: expected $expectedName $expectedVersion; found $name $version"
          }
      }

      $archive = [System.IO.Compression.ZipFile]::OpenRead($wheels[0].FullName)
      try {
          $entries = @($archive.Entries | Where-Object { $_.FullName -match '^[^/]+\.dist-info/METADATA$' })
          if ($entries.Count -ne 1) {
              throw "Expected one .dist-info/METADATA entry in $($wheels[0].Name)"
          }
          $reader = [System.IO.StreamReader]::new($entries[0].Open())
          try {
              Assert-PackageMetadata $reader.ReadToEnd() $wheels[0].Name
          }
          finally {
              $reader.Dispose()
          }
      }
      finally {
          $archive.Dispose()
      }

      # Read PKG-INFO in place; do not extract or execute the source distribution.
      $stream = [System.IO.File]::OpenRead($sdists[0].FullName)
      try {
          $gzip = [System.IO.Compression.GZipStream]::new($stream, [System.IO.Compression.CompressionMode]::Decompress)
          try {
              $tar = [System.Formats.Tar.TarReader]::new($gzip)
              try {
                  $metadataCount = 0
                  while ($null -ne ($entry = $tar.GetNextEntry())) {
                      if ($entry.Name -match '^[^/]+/PKG-INFO$') {
                          if ($null -eq $entry.DataStream) {
                              throw "PKG-INFO is not a regular file in $($sdists[0].Name)"
                          }
                          $reader = [System.IO.StreamReader]::new($entry.DataStream, [System.Text.Encoding]::UTF8, $true, 1024, $true)
                          try {
                              Assert-PackageMetadata $reader.ReadToEnd() $sdists[0].Name
                              $metadataCount++
                          }
                          finally {
                              $reader.Dispose()
                          }
                      }
                  }
                  if ($metadataCount -ne 1) {
                      throw "Expected one top-level PKG-INFO entry in $($sdists[0].Name)"
                  }
              }
              finally {
                  $tar.Dispose()
              }
          }
          finally {
              $gzip.Dispose()
          }
      }
      finally {
          $stream.Dispose()
      }
      Write-Host "Validated $expectedName $expectedVersion in wheel and source distribution"

      $ownersValue = Assert-ResolvedValue "owners" $env:ESRP_OWNERS
      $approversValue = Assert-ResolvedValue "approvers" $env:ESRP_APPROVERS
      $owners = @($ownersValue -split '[,\r\n]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
      $approvers = @($approversValue -split '[,\r\n]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
      if ($owners.Count -eq 0 -or $approvers.Count -eq 0) {
          throw "At least one owner and one approver are required"
      }
      foreach ($entry in @($owners; $approvers)) {
          if ($entry -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*@microsoft\.com$') {
              throw "Owners and approvers must be individual alias@microsoft.com accounts: $entry"
          }
      }
      $overlap = @($owners | Where-Object { $approvers -contains $_ })
      if ($overlap.Count -gt 0) {
          throw "Owners and approvers must be different individuals: $($overlap -join ', ')"
      }

      Write-Host "##vso[task.setvariable variable=esrpReleaseOwners]$($owners -join ',')"
      Write-Host "##vso[task.setvariable variable=esrpReleaseApprovers]$($approvers -join ',')"
    displayName: Validate ESRP release configuration
    env:
      ESRP_FOLDER_LOCATION: ${{ parameters.folderLocation }}
      ESRP_EXPECTED_VERSION: ${{ parameters.expectedVersion }}
      ESRP_OWNERS: ${{ parameters.owners }}
      ESRP_APPROVERS: ${{ parameters.approvers }}

  - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@14
    displayName: ${{ parameters.displayName }}
    inputs:
      connectedservicename: antares-custommiddleware-prod-esrp
      usemanagedidentity: true
      keyvaultname: custommiddleware-prod-kv
      signcertname: esrp-requestsigning-cert
      clientid: 486d42bd-c87d-4915-8fc5-9b1174954c82
      intent: PackageDistribution
      contenttype: PyPi
      contentsource: Folder
      folderlocation: ${{ parameters.folderLocation }}
      waitforreleasecompletion: true
      owners: $(esrpReleaseOwners)
      approvers: $(esrpReleaseApprovers)
      serviceendpointurl: https://api.esrp.microsoft.com
      mainpublisher: ESRPRELPACMAN
      domaintenantid: 33e01921-4d64-4f8c-a055-5bdaffd5e33d
